name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/fleeting-plugin-incus

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - name: Build release binary
        env:
          VERSION: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          REFERENCE: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          go build \
            -ldflags "-X main.version=${VERSION} -X main.revision=${REVISION} -X main.reference=${REFERENCE} -X main.builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/fleeting-plugin-incus \
            ./cmd/fleeting-plugin-incus
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fleeting-plugin-incus
          generate_release_notes: true

